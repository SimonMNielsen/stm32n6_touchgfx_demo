[package]
name = "stm32n6_touchgfx_demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# TouchGFX (C++ GUI framework) running on Rust/embassy via a small C ABI.
#
# The TouchGFX application (GUI screens, generated assets, framework library)
# is vendored in `touchgfx_project/` — the N6-native 800x480 RGB565 demo.
# build.rs compiles its C++ sources and links the Cortex-M55 TouchGFX core
# library; all board access (LTDC, touch, vsync, framebuffers, ChromART/DMA2D,
# LEDs) is Rust through the N6 BSP + embassy, with no ST HAL.

[dependencies]
# NOTE: local paths to all embassy modules to avoid version mismatch issues
# (same fork as stm32n6570_disco_bsp_demos).
embassy-stm32 = { version = "0.6.0", git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6", features = [
    "defmt",   
    "stm32n657x0",
    "time-driver-any",
    "exti",
    "unstable-pac",
    "rt",
    # memory-x intentionally omitted: STM32N6 has no internal Flash, so embassy's
    # auto-generated memory.x would panic. The BSP supplies its own memory.x instead.
    "chrono",
] }
embassy-sync = { version = "0.8.0", git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6", features = ["defmt"] }
embassy-executor = { version = "0.10.0", git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6", features = ["executor-thread", "executor-interrupt", "platform-cortex-m", "defmt"] }
embassy-time = { version = "0.5.1", git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-futures = { version = "0.1.2", git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6" }
embassy-embedded-hal = { version = "0.6.0", git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6" }
embedded-hal_10 = { version = "1.0", package="embedded-hal" }
embedded-hal = { version = "0.2.7", package="embedded-hal"  }

# Board support package for the STM32N6570-DK.
# default-features=false: we provide our own defmt-rtt + panic-probe below.
bsp_stm32n6570 = { version = "0.1.0", package = "bsp_stm32n6570_dk", git = "https://github.com/SimonMNielsen/stm32n6570_disco_bsp", default-features = false }

# TouchGFX integration layer — provides DMA2D driver, C++ glue, and build helpers.
touchgfx-rs = { version = "0.1.0", path = "../internal_crates/touchgfx-rs", features = ["stm32n6"] }

alloc-cortex-m = "0.4.4"

defmt     = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m    = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0", features = ["set-sp", "set-vtor"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless    = { version = "0.8", default-features = false }
static_cell = "2.1.1"

[build-dependencies]
cc = "1"
touchgfx-rs = { version = "0.1.0", path = "../internal_crates/touchgfx-rs", default-features = false, features = ["build"] }

[patch."https://github.com/embassy-rs/embassy"]
embassy-stm32 = { path = "../../smn_embassy_fork/embassy/embassy-stm32" }
embassy-sync = { path = "../../smn_embassy_fork/embassy/embassy-sync" }
embassy-executor = { path = "../../smn_embassy_fork/embassy/embassy-executor" }
embassy-time = { path = "../../smn_embassy_fork/embassy/embassy-time" }
embassy-futures = { path = "../../smn_embassy_fork/embassy/embassy-futures" }
embassy-embedded-hal = { path = "../../smn_embassy_fork/embassy/embassy-embedded-hal" }

[[bin]]
name = "touchgfx_demo"
path = "src/main.rs"

# ── Build profiles (same as stm32n6570_disco_bsp_demos) ──────────────────────

[profile.dev]
codegen-units = 16
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false
incremental = false
opt-level = 3
overflow-checks = false
lto = "fat"


# ── Embassy patch ─────────────────────────────────────────────────────────────
#
# Transitive git-dep crates (BSP + vl53l5cx + …) reference embassy at
# `https://github.com/embassy-rs/embassy?rev=02bf842`. We *must* use the
# local fork for `embassy-stm32` (it has our N6 NPU driver). Without a
# `[patch]`, cargo sees two distinct sources for the `links="embassy-time"`
# native package (git-rev vs path) and refuses to resolve.
#
# `[patch]` at the top-level app redirects the git-rev URL to the local
# fork for every crate in the graph, so BSP + vl53l5cx + this app all end
# up using the exact same in-tree embassy crates. Keep the local fork
# at a commit compatible with `02bf842` (same crate versions + APIs);
# `cargo update` will refuse the patch if versions diverge.
[patch."https://github.com/embassy-rs/embassy"]
embassy-stm32        = { git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6" }
embassy-sync         = { git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6" }
embassy-executor     = { git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6" }
embassy-time         = { git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6" }
embassy-futures      = { git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6" }
embassy-embedded-hal = { git = "https://github.com/SimonMNielsen/embassy", rev = "ffec85c6" }