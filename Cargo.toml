[package]
name = "stm32n6_touchgfx_demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# TouchGFX (C++ GUI framework) running on Rust/embassy via the `cxx` bridge.
#
# The TouchGFX application (GUI screens, generated assets, framework library)
# comes from the STM32CubeIDE project at C:/kode/Rust/Touchgfx_on_rust_no_rtos
# (a 480x272 16bpp no-RTOS TBS). build.rs compiles its C++ sources; all the
# board glue (LTDC, touch, vsync, framebuffers) is Rust through the N6 BSP.

[dependencies]
# NOTE: local paths to all embassy modules to avoid version mismatch issues
# (same fork as stm32n6570_disco_bsp_demos).
embassy-stm32 = { version = "0.6.0", path = "../../smn_embassy_fork/embassy/embassy-stm32", features = [
    "defmt",
    "stm32n657x0",
    "time-driver-any",
    "exti",
    "unstable-pac",
    "rt",
    # memory-x intentionally omitted: STM32N6 has no internal Flash.
    "chrono",
] }
embassy-sync = { version = "0.8.0", path = "../../smn_embassy_fork/embassy/embassy-sync", features = ["defmt"] }
embassy-executor = { version = "0.10.0", path = "../../smn_embassy_fork/embassy/embassy-executor", features = ["executor-thread", "executor-interrupt", "platform-cortex-m", "defmt"] }
embassy-time = { version = "0.5.1", path = "../../smn_embassy_fork/embassy/embassy-time", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-futures = { version = "0.1.2", path = "../../smn_embassy_fork/embassy/embassy-futures" }
embassy-embedded-hal = { version = "0.6.0", path = "../../smn_embassy_fork/embassy/embassy-embedded-hal" }

# Board support package for the STM32N6570-DK.
# default-features=false: we provide our own defmt-rtt + panic-probe below.
bsp_stm32n6570 = { version = "0.1.0", package = "bsp_stm32n6570_dk", path = "../internal_crates/stm32n6570_disco_bsp", default-features = false }

# C++ interop — the TouchGFX glue calls Rust (vsync/touch/framebuffer) and
# Rust calls C++ (touchgfx_init / taskEntry) through this bridge.
# "alloc" is cxx's minimum supported no_std configuration; the bridge itself
# only passes primitives, but the crate needs a global allocator to exist.
cxx = { version = "1.0", default-features = false, features = ["alloc"] }
alloc-cortex-m = "0.4.4"

defmt     = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m    = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0", features = ["set-sp", "set-vtor"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless    = { version = "0.8", default-features = false }
static_cell = "2.1.1"

[build-dependencies]
cc = "1"
cxx-build = "1.0"

[[bin]]
name = "touchgfx_demo"
path = "src/main.rs"

# ── Build profiles (same as stm32n6570_disco_bsp_demos) ──────────────────────

[profile.dev]
codegen-units = 16
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false
incremental = false
opt-level = 3
overflow-checks = false
lto = "fat"
