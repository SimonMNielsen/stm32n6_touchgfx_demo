[package]
name = "stm32n6_touchgfx_demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# TouchGFX (C++ GUI framework) running on Rust/embassy via a small C ABI.
#
# The TouchGFX application (GUI screens, generated assets, framework library)
# is vendored in `touchgfx_project/` — the N6-native 800x480 RGB565 demo.
# build.rs compiles its C++ sources and links the Cortex-M55 TouchGFX core
# library; all board access (LTDC, touch, vsync, framebuffers, ChromART/DMA2D,
# LEDs) is Rust through the N6 BSP + embassy, with no ST HAL.

[dependencies]
# NOTE: local paths to all embassy modules to avoid version mismatch issues
# (same fork as stm32n6570_disco_bsp_demos).
embassy-stm32 = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy", rev = "83773dc8", features = [
    "defmt",   
    "stm32n657x0",
    "time-driver-any",
    "exti",
    "unstable-pac",
    "rt",
    "chrono",
] }
embassy-sync = { version = "0.8.0", git = "https://github.com/embassy-rs/embassy", rev = "83773dc8", features = ["defmt"] }
embassy-executor = { version = "0.10.0", git = "https://github.com/embassy-rs/embassy", rev = "83773dc8", features = ["executor-thread", "executor-interrupt", "platform-cortex-m", "defmt"] }
embassy-time = { version = "0.5.1", git = "https://github.com/embassy-rs/embassy", rev = "83773dc8", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-futures = { version = "0.1.2", git = "https://github.com/embassy-rs/embassy", rev = "83773dc8" }
embassy-embedded-hal = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy", rev = "83773dc8" }
embedded-hal_10 = { version = "1.0", package="embedded-hal" }
embedded-hal = { version = "0.2.7", package="embedded-hal"  }

# Board support package for the STM32N6570-DK.
# default-features=false: we provide our own defmt-rtt + panic-probe below.
bsp_stm32n6570 = { version = "0.1.0", package = "bsp_stm32n6570_dk", git = "https://github.com/SimonMNielsen/stm32n6570_disco_bsp", rev = "c89e572", default-features = false }

# TouchGFX integration layer — provides DMA2D driver, C++ glue, and build helpers.
touchgfx-rs = { version = "0.1.0", git = "https://github.com/SimonMNielsen/touchgfx-rs", rev = "31bd228", features = ["stm32n6"] }

alloc-cortex-m = "0.4.4"

defmt     = "1.0.1"
defmt-rtt = "1.0.0"

cortex-m    = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = { version = "0.7.0", features = ["set-sp", "set-vtor"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless    = { version = "0.8", default-features = false }
static_cell = "2.1.1"

[build-dependencies]
touchgfx-rs = { version = "0.1.0", git = "https://github.com/SimonMNielsen/touchgfx-rs", rev = "31bd228", default-features = false, features = ["build"] }

[[bin]]
name = "touchgfx_demo"
path = "src/main.rs"

# ── Build profiles (same as stm32n6570_disco_bsp_demos) ──────────────────────

[profile.dev]
codegen-units = 16
debug = 2
debug-assertions = true
incremental = false
opt-level = 3
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false
incremental = false
opt-level = 3
overflow-checks = false
lto = "fat"

